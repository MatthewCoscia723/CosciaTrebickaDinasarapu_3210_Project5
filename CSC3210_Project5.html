<body>
    <div id="crosshair"></div>
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/ImprovedNoise.js"></script>

    <script type="module">

// Initializes the Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Initial daytime sky color.

// Configures the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  75, // Wider FOV for first person 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.rotation.order = "YXZ";
scene.add(camera);

// IMPORTANT: Width and depth of the square terrain
const terrainSize = 200;

// IMPORTANT: Number of grid squares along each side, where more is smoother but slower
const terrainSegments = 200;

// IMPORTANT: How stretched out the hills are, where smaller makes wider hills
const noiseScale = 0.03;

// IMPORTANT: Maximum height of the hills
const terrainHeight = 8;

// IMPORTANT: Number of noise layers stacked together, where more adds finer detail
const octaves = 5;

// IMPORTANT: How much each layer's height shrinks compared to the last
const persistence = 0.5;

// IMPORTANT: How much each layer's detail grows compared to the last
const lacunarity = 2;

// IMPORTANT: How many times the grass texture repeats across the terrain, where higher makes smaller grass detail
const grassRepeat = 40;

// Loader that turns image files into textures
const textureLoader = new THREE.TextureLoader();

// Grass texture tiled across the whole terrain
const grassTexture = textureLoader.load("assets/grass.jpg");
grassTexture.wrapS = THREE.RepeatWrapping; // Repeats the image horizontally instead of stretching it
grassTexture.wrapT = THREE.RepeatWrapping; // Repeats the image vertically
grassTexture.repeat.set(grassRepeat, grassRepeat);

// Tree bark texturing
const barkTexture = textureLoader.load("assets/treeBark.jpg");

// Tree leaf texturing
const leafTexture = textureLoader.load("assets/treeLeaves.jpg");

const leafGeometry = new THREE.SphereGeometry(0.6, 6, 5);
const leafMaterials = [
  new THREE.MeshStandardMaterial({map: leafTexture, color: 0x276235, side: THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({map: leafTexture, color: 0x71AA34, side: THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({map: leafTexture, color: 0x6F9940, side: THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({map: leafTexture, color: 0xA9E79B, side: THREE.DoubleSide})
    ];

// IMPORTANT: Radius of the highlighted circle under the center dot
const highlightRadius = 2;

// IMPORTANT: Number of grid squares across the highlight patch, where more drapes more closely over bumps
const highlightSegments = 24;

// IMPORTANT: Radius of the hole dug with each click, matching the highlight so the highlighted area is what gets dug
const digRadius = highlightRadius;

// IMPORTANT: How fast the center of the hole gets deeper while the mouse is held, in units per second
const digSpeed = 2;

const sunLight = new THREE.DirectionalLight(0xffe8b0, 1.0);
sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;

sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;

sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 250;

scene.add(sunLight.target);
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0xb7c9ff, 0.35);
scene.add(moonLight.target);
scene.add(moonLight);

const flashLight = new THREE.SpotLight(0xffffff, 1.35);
flashLight.visible = false;
flashLight.distance = 40;

scene.add(flashLight);
scene.add(flashLight.target);

const twilightSkyColor = new THREE.Color(0xd97a5f);
const nightSkyColor = new THREE.Color(0x0b1026);
const daySkyColor = new THREE.Color(0x87ceeb);
const sunsetColor = new THREE.Color(0xff7a33);
const dayLightColor = new THREE.Color(0xffe8b0);

// Function that returns the terrain height at a world position by blending the 4 nearest vertices
function getTerrainHeight(x, z) {
  const positions = terrain.geometry.attributes.position; // Attribute that stores every vertex's current height
  const cellSize = terrainSize / terrainSegments; // Width of one grid square 
  const rowLength = terrainSegments + 1; // Number of vertices in each row

  // Converts the world position into grid coordinates, where 0 is the terrain's edge
  const gridX = (x + terrainSize / 2) / cellSize;
  const gridZ = (z + terrainSize / 2) / cellSize;

  // Calculates which grid square the point is in, kept inside the terrain
  const col = THREE.MathUtils.clamp(Math.floor(gridX), 0, terrainSegments - 1);
  const row = THREE.MathUtils.clamp(Math.floor(gridZ), 0, terrainSegments - 1);

  // Calculates how far across the square the point is, from 0 to 1
  const fracX = THREE.MathUtils.clamp(gridX - col, 0, 1);
  const fracZ = THREE.MathUtils.clamp(gridZ - row, 0, 1);

  // Looks up the heights of the square's 4 corner vertices
  const backLeftHeight = positions.getY(row * rowLength + col);
  const backRightHeight = positions.getY(row * rowLength + col + 1);
  const frontLeftHeight = positions.getY((row + 1) * rowLength + col);
  const frontRightHeight = positions.getY((row + 1) * rowLength + col + 1);

  // Blends the 4 corner heights together, first along x and then along z
  const back = lerp(backLeftHeight, backRightHeight, fracX);
  const front = lerp(frontLeftHeight, frontRightHeight, fracX);
  return lerp(back, front, fracZ);
}

// Array that stores every tree as {mesh, x, z, radius}
const treeList = [];

// Object that stores what the center dot's ray is hitting
let currentHit = null;

// Remembers which tree is highlighted
let highlightedTree = null;

// Whether the left mouse button is currently held down for digging
let isDigging = false;

// Clock that measures the time between frames
const clock = new THREE.Clock();

// Reused vector that stores the flashlight's viewing direction
const flashLightDirection = new THREE.Vector3();

let orbitAngle = 0;
const orbitSpeed = THREE.MathUtils.degToRad(1.5);
const orbitRadius = 120;

// Three.js's built in Perlin noise generator
const noiseGenerator = new THREE.ImprovedNoise();

// Random slice through the 3D noise so the terrain is different every reload
const noiseSeed = Math.random() * 1000;

// Helper function that blends between a and b by the amount t
function lerp(a, b, t) {
  return a + t * (b - a);
}

// An L system that generates instructions by applying rules
function LSystem(axiom, rules, iterations) {
  let result = axiom; // start with the initial axiom

  // repeat grammar rules for a certain number of iterations
  for (let i = 0; i < iterations; i++) {
    let next = "";

    // check every symbol in the current rules
    for (let j = 0; j < result.length; j++) {
      const symbol = result[j];

      // makes sure all of the symbols have a corresponding rule
      if (rules[symbol] !== undefined) {

        // randomly chooses a rule replacement if theres multiple options (for randomness)
        if (Array.isArray(rules[symbol])) {
          let choices = rules[symbol];
          let randomIndex = Math.floor(Math.random() * choices.length);
          next += choices[randomIndex];
        } 
        // otherwise, it's deterministic
        else {
          next += rules[symbol];
        }
      } else {
        next += symbol;
      }
    }
    // saves new instructions for next iteration
    result = next;
  }
  return result; // returns completed tree instructions
}

// Creates a tree for a given set of grammar rules, how long each branch should be, and the angle it should cut-off from.
function createTree(instructions, branchLength, branchAngle) {
  const tree = new THREE.Group();

  // Shared "roots" of the tree for all branches
  const branchGeometry = new THREE.CylinderGeometry(0.10, 0.13, branchLength, 5);
  const branchMaterial = new THREE.MeshStandardMaterial({map: barkTexture, color: 0x888888});

  // values for current positions/directions
  let x = 0;
  let y = 0;
  let angle = 0;
  const stack = []; // stores branch positions and angles to go back for branching

  // reads each symbol in the grammar rules
  for (let i = 0; i < instructions.length; i++) {
    const symbol = instructions[i];

    // when the instruction is an F, create a branch
    if (symbol === "F") {
      
      // calculate branch end positions
      const endX = x + Math.sin(angle) * branchLength;
      const endY = y + Math.cos(angle) * branchLength;

      const branch = new THREE.Mesh(branchGeometry, branchMaterial);
      branch.userData.isBranch = true;

      // place the branch in the correct positions
      branch.position.set((x + endX) / 2, (y + endY) / 2, 0);
      branch.rotation.z = -angle;
      branch.castShadow = true;

      // add branch to the group
      tree.add(branch);
      
      // add leaves to the end of a branch
      if (instructions[i + 1] === "]" || i === instructions.length - 1) {
        for (let j = 0; j < 1; j++) {
          const leaves = new THREE.Mesh(leafGeometry, leafMaterials[Math.floor(Math.random() * leafMaterials.length)]);
          leaves.castShadow = true;
          const size = 0.6 + Math.random() * 0.5;
          leaves.scale.set(size, size, size);

          leaves.position.set(endX + (Math.random() - 0.5) * 0.8, endY + (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.8);
          tree.add(leaves);
        }
      }
      x = endX;
      y = endY;
    }

    // if the symbol is a +, branch right
    else if (symbol === "+") {
      angle += branchAngle;
    }

    // if the symbol is a -, branch left
    else if (symbol === "-") {
      angle -= branchAngle;
    }

    // if the symbol is a [, save the data before branching
    else if (symbol === "[") {
      stack.push([x, y, angle]);
    }
    
    // if the symbol is a ], return the stored data
    else if (symbol === "]") {
      const saved = stack.pop();

      if (saved) {
        x = saved[0];
        y = saved[1];
        angle = saved[2];
      }
    }
  }
  return tree; // return the completed tree
}

// Function that stacks several layers of Perlin noise to create fractal terrain
function fractalNoise(x , z) {
  let total = 0;
  let amplitude = 1;
  let frequency = 1;
  let maxTotal = 0; // Sum of every layer's amplitude, used to keep the result between -1 and 1

  // Iterates over every octave, adding a smaller and more detailed layer each time
  for (let i = 0; i < octaves; i++) {
    total += noiseGenerator.noise(x * frequency, z * frequency, noiseSeed) * amplitude;
    maxTotal += amplitude;
    amplitude *= persistence;
    frequency *= lacunarity;
  }

  return total / maxTotal;
}

// Function that builds the terrain mesh and shapes it with Perlin noise
function createTerrain() {
  const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);
  geometry.rotateX(-Math.PI / 2); // Lays the plane flat so its vertices use x and z
  
  const positions = geometry.attributes.position; // Attribute that stores every vertex's x, y, and z

  // Iterates over every vertex, raising it to the noise height at its x and z
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const z = positions.getZ(i);
    positions.setY(i, fractalNoise(x * noiseScale, z * noiseScale) * terrainHeight);
  }

  geometry.computeVertexNormals(); // Recalculates the lighting directions for the new shape

  const material = new THREE.MeshStandardMaterial({map: grassTexture}); // Grass texture on the standard material so lighting and shadows still work
  const mesh = new THREE.Mesh(geometry, material);
  mesh.receiveShadow = true; // Lets the trees cast shadows onto the terrain
  mesh.castShadow = false;
  return mesh;
}

// Terrain mesh that the player walks on
const terrain = createTerrain();
scene.add(terrain);

const playerEyeHeight = 2;

const startX = 0;
const startZ = 0;

let yaw = 0;
let pitch = 0;

let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;

const mouseSensitivity = 0.002;
const movementSpeed = 10;
const playerRadius = 0.5;

const terrainLimit = terrainSize / 2 - 1;

const groundHeight = getTerrainHeight(startX, startZ);

camera.position.set(startX, groundHeight + playerEyeHeight, startZ);

// Tree Grammars
// Tree 1: deterministic (same each time)
const tree1Rules = {F: "F[+F]F[-F][+F]F"};

// Tree 2 & 3: random
const tree2Rules = {F: ["F[+F]F[-F]", "F[-F]F[+F]"]};
const tree3Rules = {F: ["FF[+F][-F][+F]", "F[+FF][-F]F[+F]"]};

// Spawn 100 of tree1 (deterministic ones)
for (let i = 0; i < 100; i++) {
  const instructions = LSystem("F", tree1Rules, 2);
  const tree = createTree(instructions, 1.75, Math.PI / 6);

  // x and z coordinates to spawn them in
  const x = Math.random() * 180 - 90;
  const z = Math.random() * 180 - 90;

  // scale the trees and place them
  tree.scale.set(1.5, 1.5, 1.5);
  tree.position.set(x, getTerrainHeight(x, z), z);
  scene.add(tree);
  treeList.push({mesh: tree, x: x, z: z, radius: 1, shrunk: false, shrinking: false, shrinkTime: 0});
}

// Spawn 100 of tree2 (same backbone as above)
for (let i = 0; i < 100; i++) {
  const instructions = LSystem("F", tree2Rules, 2);
  const tree = createTree(instructions, 1.75, Math.PI / 5);

  const x = Math.random() * 180 - 90;
  const z = Math.random() * 180 - 90;

  tree.scale.set(1.5, 1.5, 1.5);
  tree.position.set(x, getTerrainHeight(x, z), z);
  scene.add(tree);
  treeList.push({mesh: tree, x: x, z: z, radius: 1, shrunk: false, shrinking: false, shrinkTime: 0});
}

// Spawn 100 of tree3 (same backbone as above)
for (let i = 0; i < 100; i++) {
  const instructions = LSystem("F", tree3Rules, 2);
  const tree = createTree(instructions, 1.75, Math.PI / 4);

  const x = Math.random() * 180 - 90;
  const z = Math.random() * 180 - 90;

  tree.scale.set(1.5, 1.5, 1.5);
  tree.position.set(x, getTerrainHeight(x, z), z);
  scene.add(tree);
  treeList.push({mesh: tree, x: x, z: z, radius: 1, shrunk: false, shrinking: false, shrinkTime: 0});
}


// Raycaster that finds what the center dot is pointing at
const raycaster = new THREE.Raycaster();

// Screen position the ray is cast through, where (0, 0) is the exact center of the screen
const rayScreenPosition = new THREE.Vector2(0, 0);

// Function that casts a ray through the center dot and stores the closest thing it hits
function updateRaycaster() {
  raycaster.setFromCamera(rayScreenPosition, camera);

  // Collects the terrain and every tree mesh as things the ray can hit
  const targets = [terrain];
  for (const tree of treeList) {
    targets.push(tree.mesh);
  }

  const hits = raycaster.intersectObjects(targets, true); // True also checks the part inside each tree

  // Keeps only the closest hit, or null when the ray hits nothing
  if (hits.length > 0) {
    currentHit = hits[0];
  } else {
    currentHit = null;
  }

  let hitTree = null;

  // Checks whether the ray hit a tree by searching through all tree groups
  if (currentHit && currentHit.object.parent) {
    for (const tree of treeList) {
      if (tree.mesh === currentHit.object.parent) {
        hitTree = tree.mesh;
        // stop searching if the tree was found
        break;
      }
    }
  }

  // If it's not a highlighted tree, make the tree normal looking
  if (highlightedTree != hitTree) {
    if (highlightedTree) {
      for (const branch of highlightedTree.children) {
        if (branch.userData.isBranch) {
          branch.material.map = barkTexture;
          branch.material.color.set(0x888888);
          branch.material.needsUpdate = true;
        }
      }
    }

    highlightedTree = hitTree;

    // If it's a highlighted tree, update color and material
    if (highlightedTree) {
      for (const branch of highlightedTree.children) {
        if (branch.userData.isBranch) {
          branch.material.map = null;
          branch.material.color.set(0xaaaa00);
          branch.material.needsUpdate = true;
        }
      }
    }
  }
}

// When there is a click on a highlighted tree and its not already shrunk, prepare to shrink it.
window.addEventListener("click", () => {
  if (document.pointerLockElement !== renderer.domElement) {
    return;
  }

  for (const tree of treeList) {
    if (tree.mesh === highlightedTree && !tree.shrunk) {
      tree.shrunk = true;
      tree.shrinking = true;
      break;
    }
  }
});

// Function that draws a soft glowing circle onto a canvas to use as the highlight's texture
function createHighlightTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 128;
  canvas.height = 128;
  const context = canvas.getContext("2d");

  // Fades from yellow in the middle to fully transparent at the edge
  const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, "rgba(255, 230, 80, 0.2)");
  gradient.addColorStop(0.7, "rgba(255, 230, 80, 0.15)");
  gradient.addColorStop(1, "rgba(255, 230, 80, 0)");

  context.fillStyle = gradient;
  context.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

// Patch that drapes over the terrain under the center dot
const highlightPatch = new THREE.Mesh(
  new THREE.PlaneGeometry(highlightRadius * 2, highlightRadius * 2, highlightSegments, highlightSegments).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({
    map: createHighlightTexture(),
    transparent: true, // Lets the faded edge show the grass underneath
    depthWrite: false, // Keeps the see-through patch from hiding things behind it
    polygonOffset: true, // Draws the patch slightly in front of the terrain so they don't flicker
    polygonOffsetFactor: -4
  })
);
highlightPatch.visible = false;
highlightPatch.frustumCulled = false; // Keeps Three.js from wrongly skipping the patch after its shape changes
scene.add(highlightPatch);

// Function that moves the highlight patch to the hit point and bends it to match the ground
function updateHighlight() {
  // Hides the patch when the ray isn't on the terrain
  if (!currentHit || currentHit.object !== terrain) {
    highlightPatch.visible = false;
    return;
  }

  highlightPatch.visible = true;
  const centerX = currentHit.point.x;
  const centerZ = currentHit.point.z;
  const positions = highlightPatch.geometry.attributes.position; // Attribute that stores the patch's vertices

  // Iterates over every vertex in the patch, setting its height to the ground below it
  for (let i = 0; i < positions.count; i++) {
    const worldX = centerX + positions.getX(i);
    const worldZ = centerZ + positions.getZ(i);
    positions.setY(i, getTerrainHeight(worldX, worldZ) + 0.05); // Lifts it slightly so it sits on top of the grass
  }
  positions.needsUpdate = true; // Tells Three.js to send the new heights to the GPU

  highlightPatch.position.set(centerX, 0, centerZ);
}

// Function that digs a smooth bowl-shaped hole in the terrain around a point
function digHole(point, amount) {
  const positions = terrain.geometry.attributes.position; // Attribute that stores every vertex's x, y, and z

  // Iterates over every vertex in the terrain, lowering the ones inside the dig radius
  for (let i = 0; i < positions.count; i++) {
    const dx = positions.getX(i) - point.x;
    const dz = positions.getZ(i) - point.z;
    const distance = Math.sqrt(dx * dx + dz * dz);

    // Skips vertices outside the hole
    if (distance > digRadius) {
      continue;
    }

    // Calculates 1 at the center of the hole down to 0 at its edge, curved so the sides slope smoothly
    const falloff = (Math.cos((distance / digRadius) * Math.PI) + 1) / 2;
    positions.setY(i, positions.getY(i) - amount * falloff);
  }

  positions.needsUpdate = true; // Tells Three.js to send the new heights to the GPU
  terrain.geometry.computeVertexNormals(); // Recalculates the lighting so the hole's sides are shaded
  terrain.geometry.computeBoundingSphere(); // Updates the bounds the raycaster uses to find the terrain
}

// Listener that starts digging when the left mouse button is pressed
window.addEventListener("mousedown", (event) => {
  if (event.button === 0 && document.pointerLockElement === renderer.domElement) {
    isDigging = true;
  }
});

// Listener that stops digging when the left mouse button is released
window.addEventListener("mouseup", (event) => {
  if (event.button === 0) {
    isDigging = false;
  }
});


// Initializes the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Softer shadow edges
document.body.appendChild(renderer.domElement);

// Click the game canvas to capture the mouse.
renderer.domElement.addEventListener("click", function() {
  renderer.domElement.requestPointerLock();
});

document.addEventListener("mousemove", function(event) {
  if (document.pointerLockElement === renderer.domElement) {
    yaw -= event.movementX * mouseSensitivity;
    pitch -= event.movementY * mouseSensitivity;

    pitch = THREE.MathUtils.clamp(pitch, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);

    camera.rotation.x = pitch;
    camera.rotation.y = yaw;
    camera.rotation.z = 0; // Ensure the camera does not roll
  }
});

document.addEventListener("keydown", function(event) {
  if (event.code === "KeyW") {
    moveForward = true;
  }
  if (event.code === "KeyS") {
    moveBackward = true;
  }
  if (event.code === "KeyA") {
    moveLeft = true;
  }
  if (event.code === "KeyD") {
    moveRight = true;
  }

  if (event.code === "KeyF" && !event.repeat && document.pointerLockElement === renderer.domElement) {
    flashLight.visible = !flashLight.visible;
  }
});

document.addEventListener("keyup", function(event) {
  if (event.code === "KeyW") {
    moveForward = false;
  }
  if (event.code === "KeyS") {
    moveBackward = false;
  }
  if (event.code === "KeyA") {
    moveLeft = false;
  }
  if (event.code === "KeyD") {
    moveRight = false;
  }
});

// Function that resizes the renderer and camera when the window changes size
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix(); // Applies the new aspect ratio to the camera
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onWindowResize);

// Function that runs once per frame to update and draw the scene
function animate() {
  requestAnimationFrame(animate); // Schedules the next frame
  
  const deltaTime = clock.getDelta(); // Time elapsed since the last frame in seconds
  orbitAngle += orbitSpeed * deltaTime;

  sunLight.position.set(
    camera.position.x + Math.cos(orbitAngle) * orbitRadius,
    Math.sin(orbitAngle) * orbitRadius,
    camera.position.z
  );

  const moonAngle = orbitAngle + Math.PI; // Moon is opposite the sun

  moonLight.position.set(
    camera.position.x + Math.cos(moonAngle) * orbitRadius,
    Math.sin(moonAngle) * orbitRadius,
    camera.position.z
  );

  // Move the sun and moon targets to follow the player
  sunLight.target.position.set(
    camera.position.x,
    getTerrainHeight(camera.position.x, camera.position.z),
    camera.position.z
  );

  moonLight.target.position.set(
    camera.position.x,
    getTerrainHeight(camera.position.x, camera.position.z),
    camera.position.z
  );

  const sunHeight = sunLight.position.y;

  if (sunHeight > 0) {
    moonLight.intensity = 0;

    if (sunHeight < 25) {
      const colorBlend = sunHeight / 25;

      sunLight.intensity = colorBlend;

      if (colorBlend < 0.5) {
        const twilightBlend = colorBlend * 2;

        scene.background.copy(nightSkyColor).lerp(twilightSkyColor, twilightBlend);

      } else {
        const dayBlend = (colorBlend - 0.5) * 2;

        scene.background.copy(twilightSkyColor).lerp(daySkyColor, dayBlend);
      }

      sunLight.color.copy(sunsetColor).lerp(dayLightColor, colorBlend);

    } else {
      sunLight.intensity = 1.0;
      scene.background.set(0x87ceeb); // Set the background to a sky blue color
      sunLight.color.set(0xffe8b0); // Set the sun light color to a warm yellowish color
    }

  } else {
    scene.background.set(0x0b1026); // Set the background to a dark night color

    sunLight.intensity = 0;

    const moonBlend = THREE.MathUtils.clamp((-sunHeight) / 25, 0, 1);
    moonLight.intensity = 0.40 * moonBlend;
  }

  // Calculates the distance the player moves this frame
  const movementAmount = movementSpeed * deltaTime;

  const forwardX = -Math.sin(yaw);
  const forwardZ = -Math.cos(yaw);

  const rightX = Math.cos(yaw);
  const rightZ = -Math.sin(yaw);

  let movementX = 0;
  let movementZ = 0;

  if (document.pointerLockElement === renderer.domElement) {
    if (moveForward) {
      movementX += forwardX;
      movementZ += forwardZ;
    }
    if (moveBackward) {
      movementX -= forwardX;
      movementZ -= forwardZ;
    }
    if (moveLeft) {
      movementX -= rightX;
      movementZ -= rightZ;
    }
    if (moveRight) {
      movementX += rightX;
      movementZ += rightZ;
    }

    const movementLength = Math.sqrt(movementX * movementX + movementZ * movementZ);

    if (movementLength > 0) {
      movementX /= movementLength;
      movementZ /= movementLength;
    }

    const nextX = camera.position.x + movementX * movementAmount;
    const nextZ = camera.position.z + movementZ * movementAmount;

    let collisionX = false;

    for (const tree of treeList) {
      const dxX = nextX - tree.x;
      const dzX = camera.position.z - tree.z;

      const distanceX = Math.sqrt(dxX * dxX + dzX * dzX);

      if (distanceX < playerRadius + tree.radius) {
        collisionX = true;
        break;
      }
    }

    if (!collisionX) {
      camera.position.x = nextX;
    }

    let collisionZ = false;

    for (const tree of treeList) {
      const dxZ = camera.position.x - tree.x;
      const dzZ = nextZ - tree.z;

      const distanceZ = Math.sqrt(dxZ * dxZ + dzZ * dzZ);

      if (distanceZ < playerRadius + tree.radius) {
        collisionZ = true;
        break;
      }
    }

    if (!collisionZ) {
      camera.position.z = nextZ;
    }

    camera.position.x = THREE.MathUtils.clamp(
      camera.position.x,
      -terrainLimit,
      terrainLimit
    );

    camera.position.z = THREE.MathUtils.clamp(
      camera.position.z,
      -terrainLimit,
      terrainLimit
    );

    camera.position.y = 
      getTerrainHeight(camera.position.x, camera.position.z) + playerEyeHeight;
  }

  flashLight.position.set(
    camera.position.x,
    camera.position.y,
    camera.position.z
  );
  
  camera.getWorldDirection(flashLightDirection);

  flashLight.target.position.copy(camera.position).add(flashLightDirection);

  // for each tree, if its shrinking, gradually shrink it
  for (const tree of treeList) {
    if (tree.shrinking) {
      tree.shrinkTime += deltaTime;
      // controls shrink speed
      let shrinkProgress = Math.min(tree.shrinkTime / 0.75, 1);
      // controls shrink size
      let scale = 1.5 - (0.60 * shrinkProgress);
      tree.mesh.scale.set(scale, scale, scale);

      if (shrinkProgress >= 1) {
        tree.shrinking = false;
      }
    }
  }

  updateRaycaster();

  // Digs a little deeper every frame while the mouse is held on the terrain
  if (isDigging && currentHit && currentHit.object === terrain) {
    digHole(currentHit.point, digSpeed * deltaTime);
  }

  updateHighlight();

  renderer.render(scene, camera);
}

animate();
    </script>
